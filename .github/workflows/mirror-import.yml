# TEMPORARY import tooling — removed from the repository after the
# production snapshot import completes. Do not use for regular builds.
name: mirror-import

on:
  workflow_dispatch: {}
  push:
    branches:
      - "arena/01a0af50-labussola"

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout tooling
        uses: actions/checkout@v4

      - name: Download production snapshot from live site
        run: python3 scripts/mirror_site.py

      - name: Attempt push to transport branch mirror/import
        id: pushstep
        continue-on-error: true
        run: |
          logf="$(mktemp)"
          rc=0
          if [ -z "$(ls -A mirror-out 2>/dev/null)" ]; then
            echo "mirror-out missing or empty" >"$logf"
            rc=1
          else
            (
              cd mirror-out
              git init -q -b mirror-import .
              git config user.name "mirror-import"
              git config user.email "mirror-import@users.noreply.github.com"
              git add -A
              git commit -q -m "La Bussola — production snapshot from labussolaitalia.com (2026-09-17)"
              git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/mirror/import
            ) >"$logf" 2>&1 || rc=$?
          fi
          if [ "$rc" -eq 0 ]; then
            echo "ok=true" >>"$GITHUB_OUTPUT"
            echo "::notice::BRANCH-PUSH-OK mirror/import"
          else
            echo "ok=false" >>"$GITHUB_OUTPUT"
            tail -8 "$logf" | sed 's/^/push-log: /'
            echo "::error::BRANCH-PUSH-FAIL rc=$rc :: $(tail -1 "$logf" | head -c 600)"
          fi

      - name: Transfer snapshot via public gist (fallback)
        if: steps.pushstep.outputs.ok != 'true'
        run: python3 scripts/upload_gist.py

      - name: Snapshot archive (fallback artifact)
        if: always()
        run: |
          if [ -d mirror-out ]; then
            cd mirror-out && zip -qr ../mirror-snapshot.zip . && cd ..
            ls -la mirror-snapshot.zip
          fi

      - name: Upload snapshot archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mirror-snapshot
          path: mirror-snapshot.zip
