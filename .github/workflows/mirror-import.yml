# TEMPORARY import tooling — removed from the repository after the
# production snapshot import completes. Do not use for regular builds.
name: mirror-import

on:
  workflow_dispatch: {}
  push:
    branches:
      - "arena/01a0af50-labussola"

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout tooling
        uses: actions/checkout@v4

      - name: Download production snapshot from live site
        run: python3 scripts/mirror_site.py

      - name: Size report (annotations)
        run: |
          total=$(du -sb mirror-out | cut -f1)
          nfiles=$(find mirror-out -type f | wc -l)
          echo "::notice::SIZE total_bytes=$total files=$nfiles"
          find mirror-out -type f -printf '%s\t%p\n' | sort -rn | head -25 | \
            while IFS=$'\t' read -r sz p; do
              echo "::notice::TOP ${sz}B ${p}"
            done

      - name: Ship snapshot to sandbox receiver
        env:
          SHIP_URL: "https://8899-iz0o7wqplqvb8ylxn9ny4.e2b.app/put/89141fe0d721103bb4fafdf8bd11b37bd84e839f7783d20e646e55643b3505bd/"
        run: python3 scripts/ship_tarball.py

      - name: Snapshot archive (fallback artifact)
        if: always()
        run: |
          if [ -d mirror-out ]; then
            cd mirror-out && zip -qr ../mirror-snapshot.zip . && cd ..
            ls -la mirror-snapshot.zip
          fi

      - name: Upload snapshot archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mirror-snapshot
          path: mirror-snapshot.zip
