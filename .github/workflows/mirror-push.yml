name: mirror-push
on:
  workflow_dispatch: {}
  push:
    branches:
      - "arena/01a0af61-labussola"

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Checkout tooling from arena branch
        uses: actions/checkout@v4
        with:
          ref: arena/01a0af61-labussola
          path: tooling
          fetch-depth: 1

      - name: Download production snapshot
        env:
          MIRROR_OUT: mirror-out
        run: |
          python3 tooling/scripts/mirror_site.py
          ls -la mirror-out | head -n 100
          echo "files=$(find mirror-out -type f | wc -l)"
          du -sh mirror-out
          echo "Checking index.html"
          ls -lh mirror-out/index.html || ls -lh mirror-out/ | head -n 20

      - name: Replace main with production snapshot
        run: |
          set -e
          shopt -s dotglob nullglob
          echo "Cleaning repo root..."
          for f in *; do
            if [ "$f" = ".git" ]; then continue; fi
            if [ "$f" = "tooling" ]; then continue; fi
            if [ "$f" = "mirror-out" ]; then continue; fi
            echo "Removing $f"
            rm -rf "$f"
          done
          for f in .[!.]*; do
            if [ "$f" = ".git" ]; then continue; fi
            echo "Removing hidden $f"
            rm -rf "$f"
          done
          echo "Copying mirror-out to root..."
          # Copy all files including hidden? mirror-out contains index.html at top
          cp -r mirror-out/* . 2>/dev/null || true
          # Also copy dotfiles if any
          cp -r mirror-out/.* . 2>/dev/null || true
          rm -rf tooling mirror-out
          ls -la | head -n 200
          echo "Checking index.html exists..."
          ls -lh index.html
          echo "Checking assets..."
          ls -lh | head -n 100

      - name: Commit and push to main
        run: |
          git config user.email "arena-agent@arena.ai"
          git config user.name "Arena Agent"
          git add -A
          git status
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "mirror production snapshot from https://labussolaitalia.com/ $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push origin HEAD:main
