name: Test Fetch Labussola
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Try curl site
        run: |
          set -x
          curl -v https://labussolaitalia.com/ --max-time 30 || echo "curl failed"
          echo "---try wget---"
          wget --no-check-certificate -qO- https://labussolaitalia.com/ --timeout=30 | head -n 500 || echo "wget failed"
          echo "---try curl with UA---"
          curl -A "Mozilla/5.0" -v https://labussolaitalia.com/ --max-time 30 | head -n 1000 || echo "curl UA failed"
          echo "---try curl -k---"
          curl -k -v https://labussolaitalia.com/ --max-time 30 | head -n 1000 || echo "curl -k failed"
